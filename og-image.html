<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 630px;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, #649b29 0%, #4f7d1e 100%);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card {
      text-align: center; color: #fff;
      max-width: 900px;
    }
    .card .emoji {
      font-size: 80px; margin-bottom: 24px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    }
    .card h1 {
      font-size: 64px; font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .card p {
      font-size: 26px; font-weight: 500;
      opacity: 0.92;
      line-height: 1.5;
    }
    .card .tagline {
      font-size: 18px; margin-top: 20px;
      opacity: 0.75; font-weight: 400;
    }
    .card .url {
      font-size: 16px; margin-top: 28px;
      opacity: 0.65; font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🥑</div>
    <h1>爱我果饮 AvoJuice</h1>
    <p>本真之味，果中显</p>
    <p class="tagline">UTAR 校园 · 真水果现榨 · 不用浓缩果汁</p>
    <p class="url">avojuice.com</p>
  </div>
</body>
</html>
